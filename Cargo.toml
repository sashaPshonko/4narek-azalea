[workspace]
resolver = "2"
members = ["crates/ipc", "crates/orch", "crates/bot"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# без feature `log` — иначе Bevy LogPlugin орёт и конфликтует с нашим tracing
azalea = { version = "=0.15.1", default-features = false, features = ["packet-event"] }
azalea-inventory = "=0.15.1"
socks5-impl = { version = "0.8", features = ["client"] }

[patch.crates-io]
rsa = { path = "vendor/rsa" }
# click_event в Style (JSON+NBT) — апстрим пока Default
azalea-chat = { path = "vendor/azalea-chat" }
